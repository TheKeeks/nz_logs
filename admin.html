<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Admin - NZ Travel Blog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-container">
  <div class="title-bar">Admin Panel - NZ Travel Blog</div>
  <div class="page-inner">

    <div class="site-header">
      <h1>Admin Panel</h1>
      <p><a href="index.html">&laquo; Back to site</a></p>
    </div>

    <!-- New Post Section -->
    <div class="admin-section">
      <h2>New Post</h2>

      <label for="post-title">Title:</label>
      <input type="text" id="post-title" placeholder="e.g. Arrived in Queenstown!">

      <label for="post-location">Location:</label>
      <input type="text" id="post-location" placeholder="e.g. Queenstown, South Island">

      <label for="post-date">Date:</label>
      <input type="date" id="post-date">

      <label for="post-body">Body (HTML supported):</label>
      <textarea id="post-body" placeholder="<p>Write your post here...</p>"></textarea>

      <div class="admin-buttons">
        <button class="btn" id="btn-embed-instagram">Embed Instagram Post</button>
        <button class="btn" id="btn-preview">Preview</button>
        <button class="btn" id="btn-publish">Publish Post</button>
      </div>

      <div id="preview-area" class="preview-area"></div>
      <div id="status-msg" class="status-msg" style="display:none;"></div>
    </div>

    <!-- Marquee Settings -->
    <div class="admin-section">
      <h2>Site Settings</h2>

      <label for="marquee-text-input">Marquee text:</label>
      <input type="text" id="marquee-text-input" placeholder="*** Your scrolling message ***">

      <div class="admin-buttons" style="margin-top: 6px;">
        <button class="btn" id="btn-save-marquee">Save Marquee</button>
        <button class="btn" id="btn-update-token">Update GitHub Token</button>
      </div>
    </div>

    <div class="site-footer">
      &copy; 2026 TheKeeks | Admin Panel
    </div>

  </div>
</div>

<script src="js/instagram.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
